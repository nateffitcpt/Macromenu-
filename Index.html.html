/* ---- eating-out matcher: fixed items, find best 1–3 item order ---- */

function findOrders(items, remaining) {
  const combos = [];
  const n = items.length;
  for (let i = 0; i < n; i++) {
    combos.push([items[i]]);
    for (let j = i; j < n; j++) {
      combos.push([items[i], items[j]]);
      for (let k = j; k < n; k++) combos.push([items[i], items[j], items[k]]);
    }
  }
  const scored = combos.map((combo) => {
    const t = combo.reduce((a, it) => ({ p: a.p + it.p, c: a.c + it.c, f: a.f + it.f }), { p: 0, c: 0, f: 0 });
    // undershoot is ok-ish, overshoot is penalized harder
    const dev = (v, tgt, w) => {
      const d = (v - tgt) / Math.max(tgt, 1);
      return (d > 0 ? d * 2.2 : -d) * w;
    };
    const score = dev(t.p, remaining.p, 1.4) + dev(t.c, remaining.c, 1) + dev(t.f, remaining.f, 1);
    return { combo, totals: t, score };
  });
  scored.sort((a, b) => a.score - b.score);
  // top 3 with distinct first items for variety
  const out = [];
  const seen = new Set();
  for (const s of scored) {
    const key = s.combo.map((x) => x.name).sort().join("|");
    const lead = s.combo[0].name;
    if (seen.has(key) || out.some((o) => o.combo[0].name === lead && out.length < 2)) continue;
    seen.add(key);
    out.push(s);
    if (out.length === 3) break;
  }
  return out;
}

/* ------------------------- matching engine ------------------------- */
/* Variables = grams of every ingredient in the day's meals.          */

function macrosOfItems(items) {
  return items.reduce((a, it) => {
    it.parts.forEach((pt) => {
      a.p += (pt.ing.p * pt.grams) / 100;
      a.c += (pt.ing.c * pt.grams) / 100;
      a.f += (pt.ing.f * pt.grams) / 100;
    });
    return a;
  }, { p: 0, c: 0, f: 0 });
}

function mealMacros(it) {
  return it.parts.reduce((a, pt) => ({
    p: a.p + (pt.ing.p * pt.grams) / 100,
    c: a.c + (pt.ing.c * pt.grams) / 100,
    f: a.f + (pt.ing.f * pt.grams) / 100,
  }), { p: 0, c: 0, f: 0 });
}

function scoreTotals(t, target) {
  return (
    (Math.abs(t.p - target.p) / Math.max(target.p, 1)) * 1.4 +
    Math.abs(t.c - target.c) / Math.max(target.c, 1) +
    Math.abs(t.f - target.f) / Math.max(target.f, 1)
  );
}

function buildItems(meals) {
  // expand a meal combo into solvable items with per-ingredient grams
  return meals.map((m) => ({
    meal: m,
    parts: m.parts.map(([key, grams]) => ({ key, ing: ING[key], base: grams, grams })),
  }));
}

function solveGrams(items, target, fixedMealIds = new Set()) {
  // gradient-style nudging on every free ingredient
  for (let pass = 0; pass < 220; pass++) {
    const t = macrosOfItems(items);
    const eP = (target.p - t.p) / Math.max(target.p, 1);
    const eC = (target.c - t.c) / Math.max(target.c, 1);
    const eF = (target.f - t.f) / Math.max(target.f, 1);
    if (Math.abs(eP) + Math.abs(eC) + Math.abs(eF) < 0.01) break;

    items.forEach((it) => {
      if (fixedMealIds.has(it.meal.id)) return;
      it.parts.forEach((pt) => {
        // how much this ingredient moves each macro, per gram
        const gP = pt.ing.p / 100, gC = pt.ing.c / 100, gF = pt.ing.f / 100;
        const push = (eP * 1.4 * gP + eC * gC + eF * gF) * 14;
        const next = pt.grams + push;
        pt.grams = Math.min(pt.base * 2.5, Math.max(pt.base * 0.4, next));
      });
    });
  }
  // snap to 5g — weighable in real life
  items.forEach((it) => {
    if (fixedMealIds.has(it.meal.id)) return;
    it.parts.forEach((pt) => (pt.grams = Math.round(pt.grams / 5) * 5));
  });
  return items;
}

function generateDayPlan(meals, target, mealCount, lockedItems = [], varietyPenalty = {}) {
  const lockedIdSet = new Set(lockedItems.map((li) => li.meal.id));
  const pool = meals.filter((m) => !lockedIdSet.has(m.id));
  const need = mealCount - lockedItems.length;
  let best = null;

  for (let iter = 0; iter < 60; iter++) {
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const picks = shuffled.slice(0, need);
    if (picks.length < need) break;

    // deep-copy locked items so their grams stay fixed
    const items = [
      ...lockedItems.map((li) => ({ meal: li.meal, parts: li.parts.map((pt) => ({ ...pt })) })),
      ...buildItems(picks),
    ];
    solveGrams(items, target, lockedIdSet);

    const totals = macrosOfItems(items);
    const vp = items.reduce((a, it) => a + (varietyPenalty[it.meal.id] || 0) * 0.015, 0);
    const s = scoreTotals(totals, target) + vp;
    if (!best || s < best.score) {
      best = {
        score: s,
        items,
        totals: { p: Math.round(totals.p), c: Math.round(totals.c), f: Math.round(totals.f) },
      };
    }
  }
  return best;
}

function generateWeekPlan(meals, target, mealCount) {
  const usage = {};
  return DAYS.map(() => {
    const day = generateDayPlan(meals, target, mealCount, [], usage);
    day.items.forEach((it) => (usage[it.meal.id] = (usage[it.meal.id] || 0) + 1));
    return day;
  });
}

function aggregateWeekIngredients(week) {
  const map = {};
  week.forEach((day) =>
    day.items.forEach((it) =>
      it.parts.forEach((pt) => {
        if (!map[pt.key]) map[pt.key] = { name: pt.ing.name, grams: 0 };
        map[pt.key].grams += pt.grams;
      })
    )
  );
  return Object.values(map).sort((a, b) => b.grams - a.grams);
}

const fmtGrams = (g) => (g >= 1000 ? `${(g / 1000).toFixed(2).replace(/0+$/, "").replace(/\.$/, "")} kg` : `${Math.round(g)} g`);

function MacroBar({ label, value, target, color }) {
  const pct = Math.min(115, (value / Math.max(target, 1)) * 100);
  const off = value - target;
  const within = Math.abs(off) / Math.max(target, 1) <= 0.05;
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 600, color: C.ink, marginBottom: 4 }}>
        <span>{label}</span>
        <span style={{ fontVariantNumeric: "tabular-nums", color: within ? C.green : C.inkSoft }}>
          {value}g / {target}g{" "}
          <span style={{ color: within ? C.green : Math.abs(off) > target * 0.1 ? C.danger : C.inkSoft }}>
            ({off >= 0 ? "+" : ""}{off}g)
          </span>
        </span>
      </div>
      <div style={{ height: 10, background: C.line, borderRadius: 6, overflow: "hidden", position: "relative" }}>
        <div style={{ width: `${Math.min(pct, 100)}%`, height: "100%", background: color, borderRadius: 6, transition: "width .4s ease" }} />
        {pct > 100 && (
          <div style={{ position: "absolute", right: 0, top: 0, height: "100%", width: `${pct - 100}%`, background: C.danger, opacity: 0.7 }} />
        )}
      </div>
    </div>
  );
}

function Num({ value, onChange, w = 64 }) {
  return (
    <input
      type="number"
      value={value}
      onChange={(e) => onChange(Number(e.target.value) || 0)}

        fontSize: 14, fontWeight: 600, color: C.ink, fontVariantNumeric: "tabular-nums",
        background: C.card, textAlign: "center",
      }}
    />
  );
}

                    width: "100%", marginTop: 12, padding: "11px 0", borderRadius: 10, cursor: "pointer",
                    border: `1.5px solid ${C.ink}`, background: "transparent", color: C.ink,
                    fontFamily: "'Barlow Semi Condensed', sans-serif", fontWeight: 700, fontSize: 15, letterSpacing: "0.05em", textTransform: "uppercase",
                  }}
                >
                  Send to prep list
                </button>
              </div>
            )}

            {mode === "week" && weekPlan && (
              <div style={{ ...card, marginBottom: 16 }}>
                <div style={{ fontFamily: "'Barlow Semi Condensed', sans-serif", fontWeight: 700, fontSize: 17, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 10 }}>
                  This week
                </div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                  {DAYS.map((d, i) => (
                    <button key={d} onClick={() => setOpenDay(i)} style={{ ...pill(openDay === i), padding: "6px 10px" }}>
                      {d}
                    </button>
                  ))}
                </div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 8, fontVariantNumeric: "tabular-nums" }}>
                  {DAYS[openDay]}: {weekPlan[openDay].totals.p}P / {weekPlan[openDay].totals.c}C / {weekPlan[openDay].totals.f}F · {kcalOf(weekPlan[openDay].totals)} kcal
                </div>
                <div style={{ display: "grid", gap: 8 }}>
                  {weekPlan[openDay].items.map((it, i) => <MealCard key={i} it={it} lockable={false} />)}
                </div>
                <button
                  onClick={sendWeekToPrep}
                  style={{
                    width: "100%", marginTop: 12, padding: "11px 0", borderRadius: 10, cursor: "pointer",
                    border: `1.5px solid ${C.ink}`, background: "transparent", color: C.ink,
                    fontFamily: "'Barlow Semi Condensed', sans-serif", fontWeight: 700, fontSize: 15, letterSpacing: "0.05em", textTransform: "uppercase",
                  }}
                >
                  Build weekly shopping / prep list
                </button>
              </div>
            )}

            {mode === "eatout" && orders && (
              <div style={{ ...card, marginBottom: 16 }}>
                <div style={{ fontFamily: "'Barlow Semi Condensed', sans-serif", fontWeight: 700, fontSize: 17, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>
                  Best orders at {venues.find((v) => v.id === eatVenueId).name}
                </div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 12 }}>
                  Ranked by fit to your remaining macros ({remaining.p}P / {remaining.c}C / {remaining.f}F). Nutrition figures are approximate.
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {orders.map((o, i) => {
                    const over = (v, tgt) => v > tgt * 1.05;
                    return (
                      <div key={i} style={{
                        padding: "10px 12px", borderRadius: 10,
                        border: `1.5px solid ${i === 0 ? C.green : C.line}`,
                        background: i === 0 ? C.greenSoft : C.paper,
                      }}>
                        <div style={{ fontSize: 11, fontWeight: 800, color: i === 0 ? C.green : C.inkSoft, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>
                          {i === 0 ? "Best fit" : `Option ${i + 1}`}
                        </div>
                        {(() => {
                          const counts = {};
                          o.combo.forEach((it) => (counts[it.name] = (counts[it.name] || 0) + 1));
                          return Object.entries(counts).map(([name, ct], j) => (
                            <div key={j} style={{ fontWeight: 600, fontSize: 14 }}>
                              {ct > 1 ? `${ct}× ` : ""}{name}
                            </div>
                          ));
                        })()}
                        <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 4, fontVariantNumeric: "tabular-nums" }}>
                          <span style={{ color: over(o.totals.p, remaining.p) ? C.danger : C.inkSoft }}>{o.totals.p}P</span>
                          {" / "}
                          <span style={{ color: over(o.totals.c, remaining.c) ? C.danger : C.inkSoft }}>{o.totals.c}C</span>
                          {" / "}
                          <span style={{ color: over(o.totals.f, remaining.f) ? C.danger : C.inkSoft }}>{o.totals.f}F</span>
                          {" · "}{kcalOf(o.totals)} kcal
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {prepList.length > 0 && (
              <div style={card}>
                <div style={{ fontFamily: "'Barlow Semi Condensed', sans-serif", fontWeight: 700, fontSize: 17, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4 }}>
                  Prep list
                </div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginBottom: 10 }}>
                  {mode === "week" ? "Total ingredient amounts to buy & batch-cook for the week." : "What to prep for today."}
                </div>
                <div style={{ display: "grid", gap: 6 }}>
                  {prepList.map((it, i) => (
                    <label key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", fontSize: 14, padding: "6px 4px", cursor: "pointer" }}>
                      <input
                        type="checkbox"
                        checked={it.done}
                        onChange={() => setPrepList((pl) => pl.map((x, j) => (j === i ? { ...x, done: !x.done } : x)))}
                        style={{ width: 18, height: 18, accentColor: C.green, marginTop: 2 }}
                      />
                      <span style={{ textDecoration: it.done ? "line-through" : "none", color: it.done ? C.inkSoft : C.ink }}>
                        <b>{it.label}</b> — {it.detail}
                      </span>
                    </label>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MacroFit />);
</script>
</body>
</html>
